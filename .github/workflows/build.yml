name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: tleb/buildozer-action@master
        with:
          python-version: "3.11"
          buildozer-args: android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotosSync-APK
          path: bin/*.apk
          retention-days: 30
